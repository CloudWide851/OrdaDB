name: Source size

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-size-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify 32 KiB source policy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.89.0"
          target: x86_64-pc-windows-msvc
      - name: Verify Rust source splitter
        run: pnpm source:split:test
      - name: Verify tracked source sizes
        run: pnpm source:size
