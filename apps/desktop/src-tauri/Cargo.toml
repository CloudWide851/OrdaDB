[package]
name = "ordadb-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "ordadb_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ordadb"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait.workspace = true
ordadb-ai = { path = "../../../crates/ordadb-ai" }
ordadb-connector-sdk = { path = "../../../crates/ordadb-connector-sdk" }
ordadb-connectors = { path = "../../../crates/ordadb-connectors" }
ordadb-protocol = { path = "../../../crates/ordadb-protocol" }
ordadb-server = { path = "../../../crates/ordadb-server" }
ordadb-sql = { path = "../../../crates/ordadb-sql" }
ordadb-types = { path = "../../../crates/ordadb-types" }
ordadb-windows = { path = "../../../crates/ordadb-windows" }
reqwest.workspace = true
rfd = { version = "0.15.4", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tauri = { version = "2", features = [] }
tokio.workspace = true
tokio-util.workspace = true
trash = { version = "5.2.5", default-features = false, features = ["coinit_apartmentthreaded"] }
uuid.workspace = true
windows-service.workspace = true
windows-sys.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true
