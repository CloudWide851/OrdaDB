[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/ordadb-catalog",
  "crates/ordadb-admin",
  "crates/ordadb-ai",
  "crates/ordadb-backup",
  "crates/ordadb-cli",
  "crates/ordadb-cluster",
  "crates/ordadb-connector-clickhouse",
  "crates/ordadb-connector-mariadb",
  "crates/ordadb-connector-mongodb",
  "crates/ordadb-connector-mysql",
  "crates/ordadb-connector-oracle",
  "crates/ordadb-connector-postgresql",
  "crates/ordadb-connector-publisher",
  "crates/ordadb-connector-redis",
  "crates/ordadb-connector-sdk",
  "crates/ordadb-connector-sql-server",
  "crates/ordadb-connector-sqlite",
  "crates/ordadb-connectors",
  "crates/ordadb-engine",
  "crates/ordadb-execution",
  "crates/ordadb-index",
  "crates/ordadb-optimizer",
  "crates/ordadb-plpgsql",
  "crates/ordadb-protocol",
  "crates/ordadb-search",
  "crates/ordadb-server",
  "crates/ordadb-sql",
  "crates/ordadb-storage",
  "crates/ordadb-transaction",
  "crates/ordadb-types",
  "crates/ordadb-windows",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
authors = ["CloudWide851"]

[workspace.dependencies]
argon2 = "0.5.3"
async-trait = "0.1.89"
async-stream = "0.3.6"
axum = { version = "0.8.9", features = ["http1", "json", "tokio"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
crc32c = "0.6.8"
csv = "1.4.0"
ed25519-dalek = "2.2.0"
futures-core = "0.3.32"
futures-util = "0.3.32"
hmac = "0.12.1"
pbkdf2 = "0.12.2"
rand = "0.8.7"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls", "stream"] }
rusqlite = { version = "0.39.0", features = ["bundled", "chrono", "uuid"] }
rustls = "0.23.36"
rust_decimal = { version = "1.42.1", features = ["serde", "db-tokio-postgres"] }
semver = { version = "1.0.27", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
sqlparser = "0.62.0"
subtle = "2.6.1"
tantivy = { version = "0.26.1", default-features = false }
tempfile = "3.23.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
tokio-postgres-rustls = { version = "0.14.0", features = ["ring", "native-certs"] }
tokio-util = { version = "0.7.19", features = ["rt", "compat"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.11", features = ["cors", "trace"] }
uuid = { version = "1.21.0", features = ["serde", "v4"] }
windows-service = "0.8.1"
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Credentials",
  "Win32_Storage_FileSystem",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
] }
zeroize = { version = "1.9.0", features = ["derive"] }
mysql_async = { version = "0.37.0", default-features = false, features = ["default-rustls-ring", "chrono", "rust_decimal"] }
mongodb = "3.8.0"
oracle = "0.6.3"
redis = { version = "1.5.0", default-features = false, features = ["tokio-rustls-comp", "cluster-async"] }
tiberius = { version = "0.12.3", default-features = false, features = ["tds73", "native-tls", "tokio", "chrono", "rust_decimal", "sql-browser-tokio"] }
