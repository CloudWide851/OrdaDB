[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/ordadb-catalog",
  "crates/ordadb-engine",
  "crates/ordadb-sql",
  "crates/ordadb-storage",
  "crates/ordadb-types",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
authors = ["CloudWide851"]

[workspace.dependencies]
chrono = { version = "0.4.42", features = ["serde"] }
crc32c = "0.6.8"
rust_decimal = { version = "1.42.1", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlparser = "0.62.0"
tempfile = "3.23.0"
thiserror = "2.0.19"
uuid = { version = "1.21.0", features = ["serde", "v4"] }
